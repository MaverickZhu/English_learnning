version: "3.9"

services:
  api:
    build: ../backend
    container_name: english_learning_api
    ports:
      - "28000:8000"
    environment:
      - DATABASE_URL=postgresql://english:english@db:5432/english_learning
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_REGION=us-east-1
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL}
      - KIMI_MODEL=${KIMI_MODEL}
      - NEWS_INGEST_ENABLED=${NEWS_INGEST_ENABLED}
      - NEWS_INGEST_HOUR=${NEWS_INGEST_HOUR}
      - NEWS_INGEST_MINUTE=${NEWS_INGEST_MINUTE}
    depends_on:
      - db
      - minio
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:16
    container_name: english_learning_db
    environment:
      - POSTGRES_USER=english
      - POSTGRES_PASSWORD=english
      - POSTGRES_DB=english_learning
    ports:
      - "25432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: english_learning_minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../data/minio:/data
